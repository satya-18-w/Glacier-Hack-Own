data:
  image_size: [256, 256]
  channels: 5
  batch_size: 8  # Reduced for memory
  train_split: 0.8
  val_split: 0.2
  spectral_bands: ['Band1', 'Band2', 'Band3', 'Band4', 'Band5']

model:
  name: 'unet'
  encoder: 'resnet34'
  encoder_weights: None  # Train from scratch
  activation: 'sigmoid'

training:
  epochs: 50
  learning_rate: 0.001
  patience: 10
  min_delta: 0.001
  use_amp: true

