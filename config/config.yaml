# Model Configuration
model:
  name: "unet"  # Options: unet, attention_unet, deeplabv3plus
  in_channels: 5
  out_channels: 1
  encoder_name: "resnet34"  # For segmentation models
  encoder_weights: "imagenet"

# Training Configuration
training:
  batch_size: 16
  epochs: 100
  learning_rate: 0.001
  optimizer: "adam"
  loss: "bce_dice"  # Options: bce, dice, bce_dice, focal
  patience: 10

# Data Configuration
data:
  image_size: [256, 256]
  train_split: 0.8
  augmentation: true

# Hyperparameter Tuning
tuning:
  n_trials: 50
  timeout: 3600  # 1 hour